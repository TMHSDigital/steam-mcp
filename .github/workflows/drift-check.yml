name: Ecosystem drift check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  drift-check:
    name: Ecosystem drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: TMHSDigital/Developer-Tools-Directory/.github/actions/drift-check@f10dd5e060ffcd30e44b950c09af970f96579ff8 # v1.20
        with:
          mode: self
          format: gh-summary
