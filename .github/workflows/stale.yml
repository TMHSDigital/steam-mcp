name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Issues are the backlog: label them stale for visibility, never auto-close.
          stale-issue-message: "This issue has had no activity for 60 days. It stays open; comment if it is still relevant or no longer needed."
          days-before-issue-stale: 60
          days-before-issue-close: -1
          # PRs go stale after 30 days and close 7 days later.
          stale-pr-message: "This PR has been automatically marked as stale due to inactivity. It will be closed in 7 days if no further activity occurs."
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,priority: critical,priority: high,decision,pinned"
          exempt-pr-labels: "security,pinned"
          exempt-all-milestones: true
