name: Live contract check

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Call every no-auth tool against live Steam
        id: check
        shell: bash # explicit bash adds -o pipefail, so tee does not mask the exit code
        run: node scripts/contract-check.mjs 2>&1 | tee contract.log

      - name: Open or update a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live contract check failing"
          body="$(printf 'The nightly live contract check failed: %s\n\n```\n%s\n```' "$RUN_URL" "$(tail -n 40 contract.log)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
