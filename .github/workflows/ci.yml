name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        # Path handling (store-asset files, cookie-jar paths, escaped Windows
        # paths in SDK guides) also runs on Windows; one Node version saves minutes.
        include:
          - os: windows-latest
            node-version: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Type-check Partner-admin code (excluded from the published build)
        run: npx tsc -p tsconfig.partner.json
      - name: Type-check tests and config (vitest strips types without checking)
        run: npm run typecheck
      - run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the HTTP image and call a tool through it
        run: |
          docker build -t steam-mcp:ci .
          docker run -d --name steam-mcp -p 3000:3000 -e STEAM_MCP_ALLOWED_HOSTS=127.0.0.1 \
            -e STEAM_MCP_HTTP_TOKEN=ci-smoke-token-0123456789 steam-mcp:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/healthz && break; sleep 1; done
          # Without the bearer token the image must refuse MCP requests.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp)" = 401
          curl -fs http://127.0.0.1:3000/mcp -H 'Authorization: Bearer ci-smoke-token-0123456789' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q steam_getPlayerCount
          docker rm -f steam-mcp

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the secret rules
        run: python3 scripts/scan-secrets.py --selftest
      - name: Scan for committed Steam secrets
        run: python3 scripts/scan-secrets.py
