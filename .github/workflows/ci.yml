name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Type-check Partner-admin code (excluded from the published build)
        run: npx tsc -p tsconfig.partner.json
      - run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the HTTP image and call a tool through it
        run: |
          docker build -t steam-mcp:ci .
          docker run -d --name steam-mcp -p 3000:3000 -e STEAM_MCP_ALLOWED_HOSTS=127.0.0.1 steam-mcp:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q steam_getPlayerCount
          docker rm -f steam-mcp

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan for committed Steam secrets
        run: python3 scripts/scan-secrets.py
